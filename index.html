<!DOCTYPE html>
<html>

<!--
  WHERE THE CODE COMES FROM (including the templates from Martin)
  jsPsych 8 docs: randomization (https://www.jspsych.org/latest/reference/jspsych-randomization/),
       data.addProperties and getURLVariable (https://www.jspsych.org/latest/reference/jspsych-data/),
       timeline variables (https://www.jspsych.org/latest/overview/timeline/),
       survey-html-form plugin (https://www.jspsych.org/latest/plugins/survey-html-form/).
  DataPipe docs, condition assignment with jsPsychExtensionPipe.getCondition
       (https://pipe.jspsych.org/docs/experiments/sending-data).
-->

<head>
  <title>Reading Science Summaries Study</title>
  <!-- same jsPsych version and loading method as the class template -->
  <script src="https://unpkg.com/jspsych@8.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.0.0"></script>
  <!-- the DataPipe extension, which saves our data -->
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <!-- the five stimulus pairs, with the Study 3 comprehension questions asked at the end -->
  <script src="stimuli.js"></script>
  <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    .jspsych-content { max-width: 800px; }
    .summary-box {
      text-align: left;
      line-height: 1.6;
      padding: 16px 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
      margin-bottom: 20px;
    }
    /* NEW: the AI-disclosure label, shown inside the summary box (label arm, GPT summaries only) */
    .ai-label {
      font-size: 14px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 4px;
      background: #e8eefc;
      border: 1px solid #9fb3e6;
    }
    .page-text { text-align: left; line-height: 1.5; }
    .consent-content { text-align: left; line-height: 1.5; font-size: 15px; }
    .consent_content p { margin: 0 0 12px 0; }
    .question { font-size: 18px; font-weight: bold; margin: 10px 0 15px 0; }
    .scale-btn { width: 90px; min-height: 64px; white-space: normal; padding: 6px 4px; vertical-align: top; }
    .scale-btn .anchor { display: block; font-size: 11px; font-weight: normal; margin-top: 4px; }
    .choice-btn { min-width: 300px; }
    .mc-btn { min-width: 600px; max-width: 700px; white-space: normal; text-align: left; }
  </style>
</head>

<body></body>
<script>

  // ---------------------------------------------------------------------------
  // NEW: study phase. Every row of the data, and the file name, starts with this,
  // so pilot files are easy to spot and drop. Change it before each phase:
  //   "pilotA" = classmates (non-naive), "pilotB" = a few SONA participants, "main" = real data.
  // ---------------------------------------------------------------------------
  var study_phase = "pilotA";

  // NEW: the number of summaries each person reads (5, as in Study 3)
  var n_summaries = 5;

  // initialize jsPsych  [T]
  var jsPsych = initJsPsych({
    on_finish: function () {
      // [V1] the DataPipe extension saves the data before this runs
      jsPsych.getDisplayElement().innerHTML = `
        <div class="page-text" style="max-width: 700px; margin: 80px auto;">
          <h2>Thank you!</h2>
          <p>Your responses have been recorded. You may now close this window.</p>
        </div>`;
      // TODO (Pilot B / SONA): redirect to SONA here so participants get credit.
    },
    // send the data to DataPipe
    extensions: [
      {
        type: jsPsychExtensionPipe,
        params: {
          experiment_id: "y9WVvQkXYzA4",
          filename: function () {
            return subject_id + ".csv";
          }
        }
      }
    ]
  });

  // give each participant a random ID. Their data file is named after it.
  // NEW: the ID starts with the study phase, e.g. "pilotA_k3j9x0q2ab"
  var subject_id = study_phase + "_" + jsPsych.randomization.randomID(10);

  // NEW: SONA ID from the link, if there is one (e.g. ...github.io/markowitz2024/?sona_id=12345).
  // Classmates' links won't have one, so it will be empty for Pilot A.  
  var sona_id = jsPsych.data.getURLVariable("sona_id") || null;

  // ---------------------------------------------------------------------------
  // Measures (Markowitz, 2024, Study 2). Every item uses a 7-point scale
  // ---------------------------------------------------------------------------
  var anchors_extremely = ["Not at all", "Extremely"];
  var anchors_amount = ["Not at all", "An enormous amount"];
  var anchors_agree = ["Strongly disagree", "Strongly agree"];

  var measure_blocks = {
    manipulation_check: [
      { measure: "clear", question: "How clear was the writing in the summary you just read?", anchors: anchors_extremely },
      { measure: "complex", question: "How complex was the writing in the summary you just read?", anchors: anchors_extremely },
      { measure: "understand", question: "How much of this writing did you understand?", anchors: anchors_amount }
    ],
    author_perception: [
      { measure: "intelligent", question: "How intelligent is the scientist who wrote this summary?", anchors: anchors_extremely },
      { measure: "credible", question: "How credible is the scientist who wrote this summary?", anchors: anchors_extremely },
      { measure: "trustworthy", question: "How trustworthy is the scientist who wrote this summary?", anchors: anchors_extremely }
    ],
    author_identity: [
      { measure: "human", question: "This summary was written by a human.", anchors: anchors_agree },
      { measure: "ai", question: "This summary was written by Artificial Intelligence.", anchors: anchors_agree }
    ]
  };
  var n_items = 8;

  // make a random item order for one summary: shuffle the blocks, then the items in each block
  function makeItemOrder() {
    var block_names = jsPsych.randomization.shuffle(Object.keys(measure_blocks));
    var items = [];
    block_names.forEach(function (b) {
      jsPsych.randomization.shuffle(measure_blocks[b]).forEach(function (item) {
        items.push(Object.assign({ block: b }, item));
      });
    });
    return items;
  }

  // ---------------------------------------------------------------------------
  // NEW: version assignment, balanced within each person.  
  // Everyone reads all 5 pairs in a random order. Two get GPT, two get PNAS, and the
  // fifth is a coin flip, so each person sees a 3/2 split and never all of one version.
  // ---------------------------------------------------------------------------
  var extra_version = jsPsych.randomization.sampleWithoutReplacement(["gpt", "pnas"], 1)[0];
  var versions = jsPsych.randomization.shuffle(["gpt", "gpt", "pnas", "pnas", extra_version]);
  var selected_pairs = jsPsych.randomization.shuffle(stimulus_pairs).slice(0, n_summaries);

  // NEW: the label arm. Filled in once the condition is known (see createExperiment at the bottom).
  var condition = null;

  // The label text as stated from the write-up 
  var ai_label_html = `<div class="ai-label"><strong>AI-generated summary of the authors' abstract</strong></div>`;

  var test_stimuli = selected_pairs.map(function (pair, i) {
    return {
      stimulus_id: pair.stimulus_id,
      version: versions[i],
      text: pair[versions[i]],
      trial_in_block: i + 1,
      item_order: makeItemOrder(),
      mc_question: pair.mc_question,
      mc_options: jsPsych.randomization.shuffle(pair.mc_options),   // answer order randomized, as in Study 3
      mc_answer: pair.mc_answer,
      topic: pair.topic //where to add this?
    };
  });

  // NEW: the summary box. The label goes inside the box, above the text,
  // only for GPT summaries in the label arm.
  function summaryBox() {
    var label = "";
    if (condition === "label" && jsPsych.evaluateTimelineVariable("version") === "gpt") {
      label = ai_label_html;
    }
    return `<div class="summary-box">${label}${jsPsych.evaluateTimelineVariable("text")}</div>`;
  }

  // every trial starts its data with the same columns, in the same order
  function trialData(measure, extra) {
    return Object.assign({
      subject_id: subject_id,
      stimulus_id: null,
      version: null,
      trial_in_block: null,
      measure: measure,
      response: null,
      rt: null,
      measure_block: null,
      item_position: null
    }, extra || {});
  }

  // keep the data file tidy: drop the long HTML stimulus
  function tidy(data) {
    delete data.stimulus;
  }

  // data for the trials that belong to one summary  [V1]
  function summaryData(measure) {
    return trialData(measure, {
      stimulus_id: jsPsych.timelineVariable("stimulus_id"),
      version: jsPsych.timelineVariable("version"),
      trial_in_block: jsPsych.timelineVariable("trial_in_block")
    });
  }

  // create timeline 
  var timeline = [];

  // consent; NEW: time and comprehension questions updated
  var consent = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <h1>Research Study Consent Form</h1>
      <div class="consent-content">
        <p>You are being invited to participate in a research study titled "Reading Science Summaries." This study is being done by Dr. Bria Long from UC San Diego and associated graduate students in Experimental Methods course. You were selected to participate in this study because you are an adult in the U.S. and have been a represented population in previous psychology studies.</p>

        <p>The purpose of this study is to better understand how well previously published studies in the psychological field replicate online and with different populations. Your participation in this research should last approximately 5-30 minutes. If you agree to take part in this study, you may be asked to view a set of stimuli, including pictures, sounds, written text, or videos and then giving some responses via key-presses, verbally, or with paper-and-pencil. We may also observe your choices or preferences among an array of stimuli. These stimuli will be taken directly from or closely adapted from studies that already exist in the published psychological literature. Stimuli will include, e.g., pictures of objects and human faces, audio and video clips, short text passages, etc. None of the stimuli will be disturbing, threatening, or offensive. The online and in-person experiments described in this protocol will take no more than 30 minutes. An example game you might play would be to click on an image on the screen that matches a word you hear being said out loud. Your total expected time commitment for this study is between 5-30 minutes, and is specified in the study description.</p>

        <p>Your participation in this study is completely voluntary and you can withdraw at any time. Choosing not to participate or withdrawing will result in no penalty or loss of benefits to which you are entitled. You are free to skip any question that you choose.</p>

        <p>We will not be asking for any personally identifying information, and we will handle responses as confidentially as possible. Your SONA or Prolific IDs will never be tied to your responses on this survey. However, we cannot guarantee the confidentiality of information transmitted over the Internet. To minimize this risk, data containing anything that might be personally identifiable (e.g. Prolific IDs or IP addresses) will be encrypted on transfer and storage and will only be accessible to qualified lab personnel. We will be keeping data collected as part of this experiment indefinitely. This anonymized data (containing neither Prolific IDs nor IP addresses) may be shared with the scientific community or with other participants to be used as stimuli in future studies.</p>

        <p>If you have questions about this project or if you have a research-related problem, you may contact the researcher(s), Dr. Bria Long, <a href="mailto:brlong@ucsd.edu">brlong@ucsd.edu</a>. If you have any questions concerning your rights as a research subject, you may contact the UC San Diego Office of IRB Administration at <a href="mailto:irb@ucsd.edu">irb@ucsd.edu</a> or 858-246-4777.</p>

        <p><strong>By participating in this research you are indicating that you are at least 18 years old, have read this consent form, and agree to participate in this research study. Please keep this consent form for your records.</strong></p>`,
    choices: ["I consent to participate in this study"],
    data: trialData("consent"),
    on_finish: function (data) {
      tidy(data);
      data.response = "consent";
    }
  };
  timeline.push(consent);

  // instructions; NEW: says five instead of three
  var instructions = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="page-text">
        <h2>Instructions</h2>
        <p>You will read <strong>five</strong> summaries of scientific papers. Please read each summary carefully
        and then answer the questions below.</p>
        <p>We are not expecting you to be an expert in the topics you read about here. Instead, make your judgments
        based on how the summary is written.</p>
      </div>`,
    choices: ["Begin"],
    data: trialData("instructions"),
    on_finish: function (data) {
      tidy(data);
      data.response = null;
    }
  };
  timeline.push(instructions);

  // reading screen: one summary  
  var read_summary = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function () {
      return `
        <p class="page-text">Summary ${jsPsych.evaluateTimelineVariable("trial_in_block")} of ${n_summaries}. Please read the summary of a
        scientific paper below. We are not expecting you to be an expert in the topic discussed below. Instead, make your judgments
        based on how the summary is written.</p>
        ${summaryBox()}`;
    },
    choices: ["Continue to the questions"],
    data: summaryData("read"),
    on_finish: function (data) {
      tidy(data);
      data.response = null;
    }
  };

  // rating screen: one question on a 1-7 scale, with the summary shown above it  
  function makeRatingTrial(k) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: function () {
        var item = jsPsych.evaluateTimelineVariable("item_order")[k];
        return `
          ${summaryBox()}
          <p class="question">${item.question}</p>`;
      },
      choices: ["1", "2", "3", "4", "5", "6", "7"],
      button_html: function (choice, index) {
        var item = jsPsych.evaluateTimelineVariable("item_order")[k];
        var anchor = "";
        if (index === 0) { anchor = item.anchors[0]; }
        if (index === 6) { anchor = item.anchors[1]; }
        return `<button class="jspsych-btn scale-btn">${choice}<span class="anchor">${anchor}&nbsp;</span></button>`;
      },
      data: summaryData(null),
      on_finish: function (data) {
        var item = jsPsych.evaluateTimelineVariable("item_order")[k];
        tidy(data);
        data.measure = item.measure;
        data.measure_block = item.block;
        data.item_position = k + 1;
        data.response = data.response + 1;   // button 0-6 becomes rating 1-7
      }
    };
  }

  var rating_trials = [];
  for (var k = 0; k < n_items; k++) {
    rating_trials.push(makeRatingTrial(k));
  }

  // ---------------------------------------------------------------------------
  // COMPREHENSION SECTION (Study 3 add-on). This runs ONCE, AT THE VERY END, after all five
  // summaries have been read and rated, so the read-and-rate part is the same as Study 2.
  // The summary text is NOT shown again; a short topic cue tells people which summary is meant.
  // ---------------------------------------------------------------------------
  function topicCue() {
    return `<p class="page-text">Question about the summary on
      <strong>${jsPsych.evaluateTimelineVariable("topic")}</strong>:</p>`;
  }

  var comprehension_intro = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="page-text">
        <h2>A few more questions</h2>
        <p>You have finished rating the summaries. Next, we will ask two questions about each of the five
        summaries you read. The summaries will not be shown again, so please answer from memory as best you can.</p>
      </div>`,
    choices: ["Continue"],
    data: trialData("comprehension_intro"),
    on_finish: function (data) {
      tidy(data);
      data.response = null;
    }
  };

  // data for the comprehension trials: same columns as the rating trials, plus the position
  // of this summary within the comprehension section (1-5)
  function comprehensionData(measure) {
    var d = summaryData(measure);
    d.comprehension_position = jsPsych.timelineVariable("comprehension_position");
    return d;
  }

  // Study 3 multiple-choice comprehension question.
  // Saves the letter they chose (response), the correct letter (mc_answer), and correct (1/0).
  var mc_question = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function () {
      return `S{topicCue()}<p class="question">${jsPsych.evaluateTimelineVariable("mc_question")}</p>`;
    },
    choices: function () {
      return jsPsych.evaluateTimelineVariable("mc_options").map(function (o) { return o.text; });
    },
    button_layout: "grid",
    grid_columns: 1,
    button_html: function (choice) {
      return `<button class="jspsych-btn mc-btn">${choice}</button>`;
    },
    data: comprehensionData("mc_comprehension"),
    on_finish: function (data) {
      var options = jsPsych.evaluateTimelineVariable("mc_options");
      tidy(data);
      data.response = options[data.response].letter;
      data.mc_answer = jsPsych.evaluateTimelineVariable("mc_answer");
      data.correct = data.response === data.mc_answer ? 1 : 0;
    }
  };

  // Study 3 free-response summary on its own page after the multiple choice question
  // Prompt quoted exactly from Markowitz (2024) Study 3
  var free_response = {
    type: jsPsychSurveyHtmlForm,
    preamble: function () {return `${topicCue()}<p class="question">In your own words, please summarize the main idea and findings of the study
      you just read about. Please be as detailed as possible.</p>`;},
    html: `<textarea name="summary" rows="8" cols="70" required></textarea>`,
    button_label: "Continue",
    data: comprehensionData("free_response"),
    on_finish: function (data) {
      data.response = data.response.summary;
    }
  };

  // Part 1 (Study 2 replication): loop over the five summaries. For each one, read it, then answer the eight Study 2 questions. No comprehension questions appear here
  var test_procedure = {
    timeline: [read_summary].concat(rating_trials),
    timeline_variables: test_stimuli
  };
  timeline.push(test_procedure);

  // Part 2 (Study 3 add-on at the very end of the summaries): the comprehension section. loop over the five summaries again. 
  // the five summaries are asked about in a new random order
  var comprehension_stimuli = jsPsych.randomization.shuffle(test_stimuli).map(function (s, i) {
    return Object.assign({}, s, {comprehension_position: i + 1}, s);
  });
  var comprehension_procedure = {
    timeline: [mc_question, free_response],
    timeline_variables: comprehension_stimuli
  };
  timeline.push(comprehension_intro, comprehension_procedure);

  // one-question multiple-choice screen
  function makeChoiceTrial(measure, question, options) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p class="question">${question}</p>`,
      choices: options,
      button_layout: "grid",
      grid_columns: 1,
      button_html: function (choice) {
        return `<button class="jspsych-btn choice-btn">${choice}</button>`;
      },
      data: trialData(measure),
      on_finish: function (data) {
        tidy(data);
        data.response = options[data.response];
      }
    };
  }

  // NEW: one-question 1-7 screen (same look as the rating screens)
  function makeScaleTrial(measure, question, anchors) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p class="question">${question}</p>`,
      choices: ["1", "2", "3", "4", "5", "6", "7"],
      button_html: function (choice, index) {
        var anchor = "";
        if (index === 0) { anchor = anchors[0]; }
        if (index === 6) { anchor = anchors[1]; }
        return `<button class="jspsych-btn scale-btn">${choice}<span class="anchor">${anchor}&nbsp;</span></button>`;
      },
      data: trialData(measure),
      on_finish: function (data) {
        tidy(data);
        data.response = data.response + 1;
      }
    };
  }

  // NEW: end-of-study questions, all quoted write-up 
  var disclosure_check = makeChoiceTrial("disclosure_check",
    "Did any of the summaries you read have a label saying it was generated by AI?",
    ["Yes", "No", "Not sure"]);

  var ai_use = makeChoiceTrial("ai_use",
    "How often do you use AI chatbots such as ChatGPT, Claude, or Gemini?",
    ["Never", "Less than once a month", "About once a month", "About once a week", "Several times a week", "Daily"]);

  var ai_detect_confidence = makeScaleTrial("ai_detect_confidence",
    "How confident are you that you can tell whether a piece of writing was produced by AI?",
    anchors_extremely);

  // attention check: passing = 1 ("Strongly disagree")
  var attention_check = makeScaleTrial("attention_check",
    "To show that you are reading carefully, please select 'Strongly disagree' for this question.",
    anchors_agree);
// order as in the write up: AI use, Ai detection confidence, attention check, disclosure check
  timeline.push(ai_use, ai_detect_confidence, attention_check, disclosure_check);

  // demographics 
  var age = {
    type: jsPsychSurveyHtmlForm,
    preamble: "<p class='question'>A few questions about you</p>",
    html: `<p><label for="age">What is your age (in years)?</label><br>
           <input name="age" id="age" type="number" min="18" max="100" required style="width: 100px;"></p>`,
    button_label: "Continue",
    data: trialData("age"),
    on_finish: function (data) {
      data.response = data.response.age;
    }
  };

  var gender = makeChoiceTrial("gender", "What is your gender?",
    ["Man", "Woman", "Non-binary or another gender", "Prefer not to say"]);

  var ethnicity = makeChoiceTrial("ethnicity", "Which best describes your race or ethnicity?",
    ["American Indian or Alaska Native", "Asian", "Black or African American", "Hispanic or Latino/a",
     "Native Hawaiian or Other Pacific Islander", "White", "Multiracial", "Other", "Prefer not to say"]);

  var ideology = makeScaleTrial("ideology", "How would you describe your political ideology?",
    ["Extremely liberal", "Extremely conservative"]);

  timeline.push(age, gender, ethnicity, ideology);

  // debrief; NEW: explains the labels and gives your email
  var debrief = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function () {
      var label_text = "";
      if (condition === "label") {
        label_text = `<p>Some summaries you read had a label saying they were AI-generated. Those labels were accurate, where
          every <strong>labeled</strong> summary was written by GPT-4, and every <strong>unlabeled</strong> one was written by a human.
          We are testing whether knowing that a summary came from AI changes how people see its author.</p>`;
      }
      return `
      <div class="page-text">
        <h2>About this study</h2>
        <p>Thank you for taking part in this study! This study investigates whether an AI-generated or human written scientific summary affects
        how people see the scientist who wrote it.</p>
        <p>Each summary you read described a real paper published in the journal <em>Proceedings of the National
        Academy of Sciences</em> (PNAS). For each paper, you saw one of two versions: the summary the scientists
        wrote for the journal, or a simpler summary that was <strong>generated by an artificial intelligence
        model (GPT-4)</strong> from the paper's abstract. </p>
        ${label_text}
        <p>This study replicates Markowitz (2024), <em>PNAS Nexus</em>. If you have questions, please contact
        Sarah Segall at <a href="mailto:ssegall@ucsd.edu">ssegall@ucsd.edu</a>.</p>
        <p>Please click below to submit your responses. Thanks!</p>
      </div>`;
    },
    choices: ["Submit my responses"],
    data: trialData("debrief"),
    on_finish: function (data) {
      tidy(data);
      data.response = null;
    }
  };
  timeline.push(debrief);

  // ---------------------------------------------------------------------------
  // NEW: get the condition, then start. 
  // DataPipe hands out conditions in turn (0, 1, 0, 1, ...) so the arms stay balanced.
  // ---------------------------------------------------------------------------
  async function createExperiment() {
    var condition_method = "datapipe";
    var condition_number;
    try {
      condition_number = await jsPsychExtensionPipe.getCondition("y9WVvQkXYzA4");
    } catch (error) {
      condition_method = "random_fallback";
      condition_number = jsPsych.randomization.sampleWithoutReplacement([0, 1], 1)[0];
    }
    condition = condition_number === 1 ? "label" : "no_label";

    // these columns are added to every row of the data
    jsPsych.data.addProperties({
      subject_id: subject_id,
      study_phase: study_phase,
      sona_id: sona_id,
      condition: condition,
      condition_method: condition_method,
      pair_order: test_stimuli.map(function (s) { return s.stimulus_id + "_" + s.version; }).join("|")
    });

    // start the experiment
    jsPsych.run(timeline);
  }
  createExperiment();

</script>

</html>
